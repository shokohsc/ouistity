---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: comics
spec:
  template:
    metadata:
      labels:
        policy.gatekeeper.sh/ignore-psp-readonlyrootfilesystem: "true"
    spec:
      containers:
        - name: comics
          image: shokohsc/ouistity
          securityContext:
            readOnlyRootFilesystem: false
          env:
            - name: ENV
              value: development
          resources:
            limits:
              cpu: 1000m
              memory: 2048M
          volumeMounts:
            - name: temp
              mountPath: /app/node_modules/.vite/
      volumes:
        - name: temp
          emptyDir: {}
