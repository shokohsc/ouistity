apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: ouistity
build:
  artifacts:
    - image: shokohsc/ouistity
      context: .
      sync:
        manual:
          - src: src/**/*.js
            dest: .
          - src: src/**/*.vue
            dest: .
      docker:
        dockerfile: Dockerfile.dev
manifests:
  kustomize:
    paths:
      - k8s/base
deploy:
  kubectl: {}
profiles:
  - name: dev
    activation:
      - command: dev
    build:
      artifacts:
        - image: shokohsc/ouistity
          sync:
            manual:
              - src: src/**/*.js
                dest: .
              - src: src/**/*.vue
                dest: .
  - name: shokohsc
    build:
      artifacts:
        - image: shokohsc/ouistity
          sync:
            manual:
              - src: src/**/*.js
                dest: .
              - src: src/**/*.vue
                dest: .
          kaniko:
            cache:
              repo: shokohsc/ouistity
            dockerfile: Dockerfile.dev
            useNewRun: true
      cluster:
        dockerConfig:
          secretName: kaniko-secret
        namespace: kaniko
        pullSecretName: kaniko-secret
        labels:
          policy.gatekeeper.sh/ignore-psp-pods-allowed-user-ranges: "true"
          policy.gatekeeper.sh/ignore-psp-readonlyrootfilesystem: "true"
          policy.gatekeeper.sh/ignore-psp-allow-privilege-escalation-container: "true"
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "1"
            memory: 1Gi
    manifests:
      kustomize:
        paths:
          - k8s/overlays/shokohsc
    deploy:
      kubectl: {}
  - name: prod
    build:
      artifacts:
        - image: shokohsc/ouistity
          kaniko:
            buildArgs:
              POD_NAME: '{{.GIT_COMMIT}}'
              SENTRY_AUTH_TOKEN: db6ff5f7b002322a0b6800027fa823d5faa131dc2535e060375d902728ea8353
              SENTRY_PROJECT: comics
            cache:
              repo: shokohsc/ouistity
            dockerfile: Dockerfile
            useNewRun: true
      cluster:
        dockerConfig:
          secretName: kaniko-secret
        namespace: kaniko
        pullSecretName: kaniko-secret
        labels:
          policy.gatekeeper.sh/ignore-psp-pods-allowed-user-ranges: "true"
          policy.gatekeeper.sh/ignore-psp-readonlyrootfilesystem: "true"
          policy.gatekeeper.sh/ignore-psp-allow-privilege-escalation-container: "true"
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "1"
            memory: 1Gi
